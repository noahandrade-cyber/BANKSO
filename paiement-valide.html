<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Commande confirmée | BANKSO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/paiement.css">

</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">

        <img src="images/logo.png" alt="BANKSO">

    </a>

</header>

<main class="payment-page">

<section
    id="confirmation"
    class="payment-success"
    hidden>

    <div class="success-icon">

        <i class="fa-solid fa-circle-check"></i>

    </div>

    <h1>

        MERCI POUR VOTRE COMMANDE

    </h1>

    <p>

        Votre paiement a été accepté avec succès.

    </p>

    <p>

        Votre commande est en cours de préparation.

    </p>

    <div class="confirmation-card">

        <p>

            <strong>Numéro de commande</strong>

        </p>

        <h2 id="order-number">

            BK-

        </h2>

    </div>

    <div id="confirmation-items">

    </div>

    <a
        href="index.html"
        class="continue-btn">

        Continuer mes achats

    </a>

</section>

</main>

<script src="js/paiement-valide.js"></script>

</body>

</html>
